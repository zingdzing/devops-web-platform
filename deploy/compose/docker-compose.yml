name: devops-web-platform

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../app/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' --silent >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    image: devops-web-platform-backend:phase2
    build:
      context: ../../app/backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    image: devops-web-platform-frontend:phase2
    build:
      context: ../../app/frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
