apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devops-web-platform.fullname" . }}-mysql
  labels:
    {{- include "devops-web-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ include "devops-web-platform.fullname" . }}-mysql
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devops-web-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devops-web-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mysql
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: "{{ .Values.images.mysql.repository }}:{{ .Values.images.mysql.tag }}"
          imagePullPolicy: {{ .Values.images.mysql.pullPolicy }}
          ports:
            - name: mysql
              containerPort: {{ .Values.services.mysqlPort }}
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              value: "{{ .Values.mysql.database }}"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: MYSQL_ROOT_PASSWORD
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' --silent
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' --silent
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping --host=127.0.0.1 --silent
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.mysql | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init.sql
              readOnly: true
      volumes:
        - name: mysql-init
          configMap:
            name: {{ include "devops-web-platform.fullname" . }}-mysql-init
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          {{- include "devops-web-platform.labels" . | nindent 10 }}
          app.kubernetes.io/component: mysql
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ .Values.mysql.storageClassName }}"
        resources:
          requests:
            storage: "{{ .Values.mysql.storageSize }}"
