apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-web-platform.fullname" . }}-frontend
  labels:
    {{- include "devops-web-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "devops-web-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.services.frontendPort }}
      targetPort: http
      protocol: TCP
