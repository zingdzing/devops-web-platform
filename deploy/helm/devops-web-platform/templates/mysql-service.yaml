apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-web-platform.fullname" . }}-mysql
  labels:
    {{- include "devops-web-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "devops-web-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: {{ .Values.services.mysqlPort }}
      targetPort: mysql
      protocol: TCP
