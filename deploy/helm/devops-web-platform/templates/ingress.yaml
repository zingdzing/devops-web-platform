{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devops-web-platform.fullname" . }}
  labels:
    {{- include "devops-web-platform.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-web-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.services.backendPort }}
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-web-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.services.backendPort }}
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-web-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.services.backendPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-web-platform.fullname" . }}-frontend
                port:
                  number: {{ .Values.services.frontendPort }}
{{- end }}
